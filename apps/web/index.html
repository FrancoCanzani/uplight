<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Base Tags -->
    <title>Uplight - Open Source Uptime Monitoring</title>
    <meta
      name="description"
      content="Open source uptime monitoring. Monitor your services from multiple regions, get instant alerts, and keep users informed with status pages."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Uplight" />
    <meta property="og:title" content="Uplight - Open Source Uptime Monitoring" />

      property="og:description"
      content="Open source uptime monitoring. Monitor your services from multiple regions, get instant alerts, and keep users informed with status pages."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Open source uptime monitoring. Monitor your services from multiple regions, get instant alerts, and keep users informed with status pages."
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
